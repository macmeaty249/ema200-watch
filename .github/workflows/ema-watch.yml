name: EMA 200 check

on:
  schedule:
    - cron: "35 21 * * 1-5"
  workflow_dispatch: {}
  push:
    paths: [tickers.txt, config.json]

permissions:
  contents: write

concurrency:
  group: ema-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check EMA 200 crosses
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python ema_watch.py

      - name: Backtest
        continue-on-error: true
        run: python backtest.py

      - name: Save state and chart page
        run: |
          git config user.name "ema-watch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json docs/index.html docs/backtest.html
          if ! git diff --cached --quiet; then
            git commit -m "EMA 200 update $(date -u +%F)"
            git pull --rebase
            git push
          fi
